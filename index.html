<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveFlow — Lead Management for HSR Motors</title>
    <meta name="description" content="DriveFlow is a real-time lead management CRM built for HSR Motors. Track leads from Facebook, Google, Twitter, Website and offline events with automated scoring, Kanban pipeline, and team dashboards." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph -->
    <meta property="og:title" content="DriveFlow — Lead Management for HSR Motors" />
    <meta property="og:description" content="Real-time lead management CRM with automated scoring, Kanban pipeline, and analytics dashboard." />
    <meta property="og:type" content="website" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Loading state before React hydrates */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
      }
      #root:empty::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: df-spin 0.6s linear infinite;
      }
      @keyframes df-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
